<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Game Space | Play Together</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <main class="home">

        <!-- NAVIGATION -->
        <nav class="game-header">

            <a
                href="index.html"
                class="logo"
            >
                GAME SPACE
            </a>

            <div class="nav-links">

                <a href="games.html">
                    Games
                </a>

                <a href="index.html">
                    Home
                </a>

            </div>

        </nav>


        <!-- HERO -->
        <section class="hero">

            <p class="eyebrow">
                MULTIPLAYER GAME SPACE
            </p>

            <h1>
                Think fast.<br>
                Play together.
            </h1>

            <p class="intro">
                Quiz your friends, solve puzzles,
                test your memory and compete
                to be the best.
            </p>


            <div class="buttons">

                <a
                    href="games.html"
                    class="button-link"
                >
                    Explore Games
                </a>

                <button
                    type="button"
                    class="secondary"
                    id="joinGameButton"
                >
                    Join a Game
                </button>

            </div>

        </section>


        <!-- JOIN GAME -->
        <section
            id="joinSection"
            class="panel hidden"
        >

            <p class="eyebrow">
                JOIN A GAME
            </p>

            <h2>
                Enter the room
            </h2>

            <p>
                Get the room code from
                your host.
            </p>


            <form id="joinForm">

                <input
                    id="playerName"
                    type="text"
                    placeholder="Your name"
                    maxlength="20"
                    autocomplete="name"
                    required
                >


                <input
                    id="roomCode"
                    type="text"
                    placeholder="Room code"
                    maxlength="6"
                    autocomplete="off"
                    autocapitalize="characters"
                    required
                >


                <button
                    type="submit"
                >
                    Join Room
                </button>

            </form>

        </section>


        <!-- FOOTER -->
        <footer>
            Game Space · Play with your people
        </footer>

    </main>


    <!-- SOCKET.IO -->
    <script src="/socket.io/socket.io.js"></script>

    <!-- GAME SPACE APP -->
    <script src="app.js"></script>

</body>
</html>
