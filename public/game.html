<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Quiz Arena | Game Space</title>

    <link
        rel="stylesheet"
        href="style.css?v=5"
    >

</head>


<body>

    <main class="page-shell">

        <!-- HEADER -->
        <header class="site-header">

            <a
                href="/"
                class="brand"
            >
                GAME SPACE
            </a>

            <div class="game-header-right">

                <div class="game-label">
                    <span>●</span>
                    LIVE GAME
                </div>

                <a
                    href="/games.html"
                    class="header-games-link"
                >
                    Games
                </a>

            </div>

        </header>


        <!-- GAME -->
        <section class="game-layout">

            <!-- QUESTION -->
            <section
                class="panel question-panel"
            >

                <div class="question-top">

                    <div>

                        <p class="eyebrow">
                            QUIZ ARENA
                        </p>

                    </div>

                    <div
                        id="questionNumber"
                        class="question-number"
                    >
                        Question 1
                    </div>

                </div>


                <!-- TIMER -->
                <div class="timer-area">

                    <div
                        id="timer"
                        aria-label="Time remaining"
                    >
                        15
                    </div>

                    <div class="timer-track">

                        <div
                            id="timerProgress"
                            class="timer-progress"
                        ></div>

                    </div>

                </div>


                <!-- QUESTION -->
                <h1 id="question">
                    Loading question...
                </h1>


                <!-- ANSWERS -->
                <div id="answers">

                    <button
                        class="answer"
                        data-index="0"
                    >
                        Loading...
                    </button>

                    <button
                        class="answer"
                        data-index="1"
                    >
                        Loading...
                    </button>

                    <button
                        class="answer"
                        data-index="2"
                    >
                        Loading...
                    </button>

                    <button
                        class="answer"
                        data-index="3"
                    >
                        Loading...
                    </button>

                </div>


                <!-- ANSWER MESSAGE -->
                <p
                    id="answerMessage"
                    class="hidden"
                ></p>


                <!-- RESULTS NAVIGATION -->
                <div
                    id="resultsNavigation"
                    class="results-navigation hidden"
                >

                    <button
                        id="playAgainButton"
                        class="primary-button"
                    >
                        Play again
                    </button>

                    <a
                        href="/games.html"
                        class="secondary-button"
                    >
                        Game hub
                    </a>

                    <a
                        href="/"
                        class="text-button"
                    >
                        Back home
                    </a>

                </div>

            </section>


            <!-- LIVE SCOREBOARD -->
            <section
                class="panel score-panel"
            >

                <div class="panel-heading">

                    <div>

                        <p class="eyebrow">
                            CURRENT STANDINGS
                        </p>

                        <h2>
                            Live Scores
                        </h2>

                    </div>

                </div>


                <div id="scoreboard">

                    <div class="player">
                        Loading scores...
                    </div>

                </div>

            </section>

        </section>

    </main>


    <script src="/socket.io/socket.io.js"></script>

    <script src="game.js?v=5"></script>

</body>
</html>
