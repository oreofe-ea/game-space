```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Quiz Arena | Game Space
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <main class="home">


        <!-- =========================
             HEADER
        ========================== -->

        <div class="game-header">

            <div class="logo">
                GAME SPACE
            </div>

            <div class="game-label">
                <span>●</span>
                LIVE GAME
            </div>

        </div>


        <!-- =========================
             QUESTION CARD
        ========================== -->

        <section
            class="panel question-panel"
        >


            <!-- QUESTION HEADER -->

            <div class="question-top">

                <div
                    class="eyebrow"
                    style="margin: 0;"
                >
                    QUIZ ARENA
                </div>

                <div id="questionNumber">
                    Question 1
                </div>

            </div>


            <!-- TIMER -->

            <div class="timer-track">

                <div
                    id="timerProgress"
                    class="timer-progress"
                ></div>

            </div>


            <div
                id="timer"
                aria-label="Time remaining"
            >
                15
            </div>


            <!-- QUESTION -->

            <h1 id="question">
                Loading question...
            </h1>


            <!-- ANSWERS -->

            <div id="answers">

                <button
                    class="answer"
                    data-index="0"
                >
                    Loading...
                </button>

                <button
                    class="answer"
                    data-index="1"
                >
                    Loading...
                </button>

                <button
                    class="answer"
                    data-index="2"
                >
                    Loading...
                </button>

                <button
                    class="answer"
                    data-index="3"
                >
                    Loading...
                </button>

            </div>


            <!-- ANSWER MESSAGE -->

            <p
                id="answerMessage"
                class="hidden"
            ></p>


        </section>


        <!-- =========================
             SCOREBOARD
        ========================== -->

        <section
            class="panel score-panel"
        >

            <div class="question-top">

                <div>

                    <p
                        class="eyebrow"
                        style="margin-bottom: 5px;"
                    >
                        CURRENT STANDINGS
                    </p>

                    <h2>
                        Live Scores
                    </h2>

                </div>

            </div>


            <div id="scoreboard">

                <div class="player">
                    Loading scores...
                </div>

            </div>

        </section>


    </main>


    <script
        src="/socket.io/socket.io.js"
    ></script>

    <script
        src="game.js"
    ></script>

</body>

</html>
```
