<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Quiz Arena | Game Space
    </title>

    <!-- v4 forces browsers to load the new CSS -->
    <link
        rel="stylesheet"
        href="style.css?v=4"
    >

</head>


<body>

    <main class="home">

        <header class="game-header">

            <div class="logo">
                GAME SPACE
            </div>

            <div class="game-label">
                <span>●</span>
                LIVE GAME
            </div>

        </header>


        <!-- QUESTION -->

        <section
            class="panel question-panel"
        >

            <div class="question-top">

                <div class="eyebrow">
                    QUIZ ARENA
                </div>

                <div id="questionNumber">
                    Question 1
                </div>

            </div>


            <div class="timer-area">

                <div
                    id="timer"
                    aria-label="Time remaining"
                >
                    15
                </div>

                <div class="timer-track">

                    <div
                        id="timerProgress"
                        class="timer-progress"
                    ></div>

                </div>

            </div>


            <h1 id="question">
                Loading question...
            </h1>


            <div id="answers">

                <button
                    class="answer"
                    data-index="0"
                    type="button"
                >
                    Loading...
                </button>


                <button
                    class="answer"
                    data-index="1"
                    type="button"
                >
                    Loading...
                </button>


                <button
                    class="answer"
                    data-index="2"
                    type="button"
                >
                    Loading...
                </button>


                <button
                    class="answer"
                    data-index="3"
                    type="button"
                >
                    Loading...
                </button>

            </div>


            <p
                id="answerMessage"
                class="hidden"
            ></p>

        </section>


        <!-- SCOREBOARD -->

        <section class="panel score-panel">

            <div class="question-top">

                <div>

                    <div
                        class="eyebrow"
                        style="margin-bottom: 5px;"
                    >
                        CURRENT STANDINGS
                    </div>

                    <h2>
                        Live Scores
                    </h2>

                </div>

            </div>


            <div id="scoreboard">

                <div class="player">
                    Connecting to game...
                </div>

            </div>

        </section>

    </main>


    <script
        src="/socket.io/socket.io.js"
    ></script>

    <script
        src="game.js?v=4"
    ></script>

</body>

</html>
